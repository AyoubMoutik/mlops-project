services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: mlops-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - mlops_storage:/mlops-storage
      - ./MLOpsFull/artifacts:/workspace-artifacts
    restart: unless-stopped

  mlopsfull-serve:
    profiles:
      - serve
    build:
      context: ./MLOpsFull
      dockerfile: Dockerfile
    image: mlopsfull:monitoring
    container_name: mlopsfull-serve
    shm_size: 3g
    ports:
      - "8000:8000"
    environment:
      GITHUB_USERNAME: ${GITHUB_USERNAME:-AyoubMoutik}
      MLOPS_STORAGE_DIR: /mlops-storage
    volumes:
      - mlops_storage:/mlops-storage
    command: python -m madewithml.serve --run_id ${RUN_ID:-missing-run-id}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: mlops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: mlops-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  jenkins_home:
  mlops_storage:
    name: mlopsfull_storage
  prometheus_data:
  grafana_data:
