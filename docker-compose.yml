services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: mlops-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - mlops_storage:/mlops-storage
      - ./MLOpsFull/artifacts:/workspace-artifacts
    restart: unless-stopped

volumes:
  jenkins_home:
  mlops_storage:
    name: mlopsfull_storage
